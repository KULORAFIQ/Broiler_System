<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Broiler System</title>

<link rel="stylesheet" href="../login.css">
</head>
<body>

<section class="login-page">

<div class="login-card">

    <img src="../bahan/LOGO AYAM.jpeg" class="login-logo">

    <h2>Login Broiler System</h2>

    <input
    type="text"
    id="username"
    class="login-input"
    placeholder="Username">

    <input
    type="password"
    id="password"
    class="login-input"
    placeholder="Password">

    <button
    class="login-btn"
    onclick="loginUser()">
        Login
    </button>

    <p id="errorLogin"></p>

    <a href="../index.html" class="back-home">
        ← Kembali
    </a>

</div>

</section>

<script src="../auth.js"></script>

</body>
</html>
